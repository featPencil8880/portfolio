<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>IAN — Survey</title>
    <meta name="description" content="Share feedback on Ian’s portfolio — what stood out, what could be better, or just say hello."/>
    <meta name="theme-color" content="#f2ece0"/>
    <meta property="og:type" content="website"/>
    <meta property="og:title" content="IAN — Survey"/>
    <meta property="og:description" content="Share feedback on Ian’s portfolio — what stood out, what could be better, or just say hello."/>
    <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
    <link rel="stylesheet" href="style.css"/>
    <script src="chrome.js" defer></script>
    <script src="portfolio.js" defer></script>
</head>
<body data-page="survey" data-page-title="Survey">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" id="site-header"></header>

    <div class="layout-container">
        <aside class="left-panel" id="leftPanel" aria-label="Sections">
            <div id="site-rail"></div>
        </aside>

        <div class="content">
            <main class="content-main" id="main">

            <div class="content-container survey-container">
                <header class="page-hero">
                    <p class="eyebrow"><span class="eyebrow-num">05</span> Survey</p>
                    <h1 class="page-hero__title">Say the thing<br><em>you’re thinking.</em></h1>
                    <p class="page-hero__lede">Three short questions, no account needed. Honest notes are more useful than polite ones.</p>
                </header>

                <section class="section survey-section" aria-label="Feedback form">
                    <div class="survey-card" id="surveyFormCard">
                        <div id="surveyDynamicContent"></div>
                        <p class="survey-submit-status" id="surveySubmitStatus" role="status" aria-live="polite" hidden></p>
                    </div>

                    <div class="survey-thanks-card" id="surveyThanksCard" style="display:none">
                        <div class="survey-thanks-icon" aria-hidden="true">✓</div>
                        <p class="eyebrow">Note received</p>
                        <h2 class="survey-thanks-title" id="surveyThanksTitle"></h2>
                        <div class="survey-thanks-message" id="surveyThanksMessage"></div>
                        <button type="button" id="surveyResetBtn" class="btn btn--primary">Send another</button>
                    </div>
                </section>

            <section class="section section--notes" aria-labelledby="notesHeading">
                <div class="section-head">
                    <div>
                        <p class="eyebrow"><span class="eyebrow-num">✳</span> Journal</p>
                        <h2 class="section-title" id="notesHeading">Survey notes</h2>
                    </div>
                    <button class="link-btn" id="clearPostFilter" type="button" style="display:none">Clear filter</button>
                </div>
                <p class="section-lede">Small observations, half-formed thoughts, and things worth remembering.</p>
                <div class="post-filter-chips" id="postFilterChips"></div>
                <div class="post-list" id="postList"></div>
            </section>
            </div>
            </main>

            <div id="site-widget"></div>
            <footer class="site-footer" id="site-footer"></footer>
        </div>
    </div>

    <div id="site-overlays"></div>
    <noscript>
        <div class="noscript-bar">
            <a class="noscript-brand" href="index.html">IAN — Portfolio</a>
            <nav aria-label="Sections">
                <a href="index.html">Home</a>
                <a href="profile.html">Profile</a>
                <a href="education.html">Education</a>
                <a href="experience.html">Experience</a>
                <a href="skills.html">Skills</a>
                <a href="survey.html">Survey</a>
                <a href="games.html">Games</a>
            </nav>
            <p>This portfolio renders its notes with JavaScript. Please enable it, or use the links above to read the résumé pages.</p>
        </div>
    </noscript>
</body>
</html>
