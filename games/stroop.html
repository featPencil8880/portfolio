<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Stroop Test | Games</title>
    <link rel="stylesheet" href="game.css"/>
</head>
<body class="game-body">
    <a href="../games.html" class="game-back">← Back to Games</a>

    <main class="game-main">
        <div class="game-panel" id="introPanel">
            <h1 class="game-title">Stroop Test</h1>
            <p class="game-intro">
                The classic interference task.<br>
                A color name appears — but in a <strong>different</strong> ink color.<br>
                Your job: click the button matching the <strong style="color: var(--accent);">INK COLOR</strong>, not the word.<br>
                20 rounds. Fastest accurate responses win.
            </p>
            <button class="game-btn-primary" id="startBtn" type="button">Start Test</button>
        </div>

        <div class="game-stage" id="stagePanel" style="display: none;">
            <div class="game-trials">Round <span id="currentRound">1</span> / 20</div>
            <div class="stroop-word" id="stroopWord">READY</div>
            <div class="stroop-buttons" id="stroopButtons"></div>
        </div>

        <div class="game-panel" id="resultsPanel" style="display: none;">
            <h2 class="game-title">Results</h2>
            <div class="game-stats">
                <div>
                    <span class="game-stat-label">Correct</span>
                    <span class="game-stat-value" id="statCorrect">—</span>
                </div>
                <div>
                    <span class="game-stat-label">Avg Time</span>
                    <span class="game-stat-value" id="statAvgTime">—</span>
                </div>
                <div>
                    <span class="game-stat-label">Total</span>
                    <span class="game-stat-value" id="statTotal">—</span>
                </div>
            </div>
            <p class="game-results-note" id="resultsNote"></p>
            <button class="game-btn-primary" id="againBtn" type="button">Play Again</button>
        </div>
    </main>

    <script src="stroop.js" defer></script>
</body>
</html>
