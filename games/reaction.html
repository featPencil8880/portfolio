<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Reaction Time | Games</title>
    <link rel="stylesheet" href="game.css"/>
</head>
<body class="game-body">
    <a href="../games.html" class="game-back">← Back to Games</a>

    <main class="game-main">
        <!-- Intro -->
        <div class="game-panel" id="introPanel">
            <h1 class="game-title">Reaction Time</h1>
            <p class="game-intro">
                A simple test drawn from cognitive psychology labs.<br>
                Click the box as fast as you can when it turns <strong style="color: var(--accent);">GREEN</strong>.<br>
                Five trials. If you click before it's green, the trial restarts.
            </p>
            <button class="game-btn-primary" id="startBtn" type="button">Start Test</button>
        </div>

        <!-- Playing -->
        <div class="game-stage" id="stagePanel" style="display: none;">
            <div class="game-box" id="gameBox">
                <span class="game-box-label" id="boxLabel">Wait...</span>
            </div>
            <div class="game-trials">Trial <span id="currentTrial">1</span> / 5</div>
        </div>

        <!-- Results -->
        <div class="game-panel" id="resultsPanel" style="display: none;">
            <h2 class="game-title">Your Results</h2>
            <div class="game-stats">
                <div>
                    <span class="game-stat-label">Average</span>
                    <span class="game-stat-value" id="statAvg">—</span>
                </div>
                <div>
                    <span class="game-stat-label">Best</span>
                    <span class="game-stat-value" id="statBest">—</span>
                </div>
                <div>
                    <span class="game-stat-label">Rank</span>
                    <span class="game-stat-value" id="statRank">—</span>
                </div>
            </div>
            <p class="game-results-note" id="resultsNote"></p>
            <button class="game-btn-primary" id="againBtn" type="button">Play Again</button>
        </div>
    </main>

    <script src="reaction.js" defer></script>
</body>
</html>
