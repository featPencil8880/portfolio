        </aside>

        <div class="content">
            <main class="content-main" id="main">

            <div class="content-container profile-page">
                <header class="page-hero page-hero--profile">
                    <p class="eyebrow"><span class="eyebrow-num">01</span> Profile</p>
                    <p class="profile-greeting" id="profileGreeting"></p>
                    <h1 class="page-hero__title profile-name" id="profileName">IAN</h1>

                    <p class="page-hero__lede" id="profileTagline"></p>

                        </div>

                            <span class="tape" aria-hidden="true"></span>

                            <div class="fact-row" id="profileMeta"></div>
                            <div class="fact-card__rule" aria-hidden="true"></div>
                            <p class="fact-card__note">A quiet record of the work, the questions, and the people behind it.</p>
                        </aside>
                    </div>
                </section>

            <section class="section section--notes" aria-labelledby="notesHeading">

                <p class="section-lede">Small observations, half-formed thoughts, and things worth remembering.</p>
                <div class="post-filter-chips" id="postFilterChips"></div>
                <div class="post-list" id="postList"></div>
            </section>
