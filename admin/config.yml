backend:
  name: turbo-github
  turbo_site_id: f1bfaa59-b9ba-4a0c-921d-c73c50158dd1

media_folder: photos/polaroid
public_folder: photos/polaroid
publish_mode: simple
site_url: https://featpencil8880.github.io/portfoli
display_url: https://featpencil8880.github.io/portfoli

collections:
  - name: portfolio
    label: Portfolio
    files:
      - name: content
        label: Portfolio content
        file: content.json
        fields:
          - label: Profile
            name: profile
            widget: object
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Pronouns, name: pronouns, widget: string, required: false }
              - { label: Greeting, name: greeting, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Tagline, name: tagline, widget: text, required: false }
              - { label: Biography, name: bio, widget: text }
              - { label: About, name: about, widget: text, required: false }
              - { label: Location, name: location, widget: string, required: false }
              - { label: Email, name: email, widget: string, required: false }
              - { label: LinkedIn, name: linkedin, widget: string, required: false }
              - label: Actions
                name: actions
                widget: list
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
                  - { label: Style, name: style, widget: select, options: [primary, secondary] }
          - label: Education
            name: education
            widget: list
            required: false
            fields:
              - { label: Institution, name: institution, widget: string }
              - { label: Degree, name: degree, widget: string }
              - { label: Years, name: years, widget: string }
              - { label: Sort year, name: sortYear, widget: number, value_type: int }
              - { label: Location, name: location, widget: string, required: false }
              - { label: Description, name: description, widget: text, required: false }
              - { label: Highlights, name: highlights, widget: list, required: false }
          - label: Experience
            name: experience
            widget: list
            required: false
            fields:
              - { label: Position, name: position, widget: string }
              - { label: Organization, name: organization, widget: string }
              - { label: Years, name: years, widget: string }
              - { label: Sort year, name: sortYear, widget: number, value_type: int }
              - { label: Location, name: location, widget: string, required: false }
              - { label: Description, name: description, widget: text, required: false }
              - { label: Highlights, name: highlights, widget: list, required: false }
              - label: Documents
                name: documents
                widget: list
                required: false
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: File path, name: path, widget: string }
          - { label: Skills, name: skills, widget: list, required: false }
          - { label: Hobbies, name: hobbies, widget: list, required: false }
          - label: Field notes
            name: posts
            widget: list
            required: false
            fields:
              - { label: ID, name: id, widget: string }
              - { label: URL slug, name: slug, widget: string }
              - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
              - { label: Section, name: tab, widget: select, options: [home, profile, education, experience, skills, survey] }
              - { label: Label, name: label, widget: string }
              - { label: Author, name: author, widget: string, required: false }
              - { label: Reply to note ID, name: replyTo, widget: string, required: false }
              - { label: Reply note, name: replyComment, widget: string, required: false }
              - label: Note fields
                name: fields
                widget: list
                fields:
                  - { label: Field name, name: name, widget: string }
                  - label: Blocks
                    name: blocks
                    widget: list
                    fields:
                      - { label: Type, name: type, widget: select, options: [title, subtitle, paragraph, actions] }
                      - { label: Content, name: content, widget: text, required: false }
              - label: Attached photos
                name: photos
                widget: list
                required: false
                fields:
                  - { label: Image, name: image, widget: image }
                  - { label: Alternative text, name: alt, widget: string, required: false }
                  - { label: Position, name: position, widget: string, required: false }
          - label: Photo archive
            name: photos
            widget: list
            required: false
            fields:
              - { label: Date, name: date, widget: date }
              - { label: Caption, name: memo, widget: text, required: false }
              - { label: Alternative text, name: alt, widget: string, hint: Describe the visible subject; do not reuse the caption. }
              - { label: Image, name: image, widget: image }
              - { label: Labels, name: labels, widget: list, required: false }
          - label: Labels
            name: labels
            widget: object
            hint: Existing labels are configured here. Use the local editor for adding new label keys.
            fields:
              - { label: Birthday, name: birthday, widget: object, fields: [{ label: Color, name: color, widget: color }] }
              - { label: Task, name: task, widget: object, fields: [{ label: Color, name: color, widget: color }] }
              - { label: Event, name: event, widget: object, fields: [{ label: Color, name: color, widget: color }] }
              - { label: Memory, name: memory, widget: object, fields: [{ label: Color, name: color, widget: color }] }
              - { label: Cognitive, name: cognitive, widget: object, fields: [{ label: Color, name: color, widget: color }] }
              - { label: Belief, name: belief, widget: object, fields: [{ label: Color, name: color, widget: color }] }
              - { label: Curiosity, name: curiosity, widget: object, fields: [{ label: Color, name: color, widget: color }] }
              - { label: Hope, name: hope, widget: object, fields: [{ label: Color, name: color, widget: color }] }
              - { label: Ambition, name: ambition, widget: object, fields: [{ label: Color, name: color, widget: color }] }
              - { label: Inspiration, name: inspiration, widget: object, fields: [{ label: Color, name: color, widget: color }] }
              - { label: Opinion and advice, name: opinion & advice, widget: object, fields: [{ label: Color, name: color, widget: color }] }
              - { label: Introspection, name: introspection, widget: object, fields: [{ label: Color, name: color, widget: color }] }
          - label: Site settings
            name: site
            widget: object
            fields:
              - { label: Project name, name: projectName, widget: string }
              - { label: Theme, name: theme, widget: select, options: [retro, retro-bold] }
              - { label: Canonical base URL, name: url, widget: string, required: false }
              - label: Featured note IDs
                name: heroPostIds
                widget: object
                fields:
                  - { label: Home, name: home, widget: string, required: false }
          - label: Surveys
            name: surveys
            widget: list
            required: false
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Active, name: active, widget: boolean, default: false }
              - { label: Intro title, name: introTitle, widget: string, required: false }
              - { label: Intro text, name: introText, widget: text, required: false }
              - { label: Thank-you title, name: thankYouTitle, widget: string, required: false }
              - { label: Thank-you message, name: thankYouMessage, widget: text, required: false }
              - label: Pages
                name: fields
                widget: list
                fields:
                  - { label: Page name, name: name, widget: string }
                  - label: Questions and copy
                    name: blocks
                    widget: list
                    fields:
                      - { label: Type, name: type, widget: select, options: [heading, paragraph, text, textarea, select, radio, rating] }
                      - { label: Label or copy, name: label, widget: string, required: false }
                      - { label: Content, name: content, widget: text, required: false }
                      - { label: Required, name: required, widget: boolean, default: false }
                      - { label: Placeholder, name: placeholder, widget: string, required: false }
                      - { label: Options, name: options, widget: list, required: false }
